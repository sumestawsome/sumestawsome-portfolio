<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1.5" />
    </pattern>
    <!-- Radial Glow Accent -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="#09090b" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <circle cx="600" cy="337" r="420" fill="url(#purpleGlow)" />

  <!-- Outer Sharp Technical Frame -->
  <rect x="24" y="24" width="1152" height="627" fill="none" stroke="#27272a" stroke-width="1" />
  
  <!-- Technical Corner Marks -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#5b21b6" stroke-width="3" />
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#5b21b6" stroke-width="3" />
  <path d="M 24 631 L 24 651 L 44 651" fill="none" stroke="#5b21b6" stroke-width="3" />
  <path d="M 1176 631 L 1176 651 L 1156 651" fill="none" stroke="#5b21b6" stroke-width="3" />

  <!-- Top System Badge -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="12" height="12" fill="#5b21b6" />
    <text x="24" y="11" fill="#71717a" font-family="monospace, monospace" font-size="12" font-weight="bold" letter-spacing="2">SUMESTAWSOME.XYZ // SYSTEM ARCHIVE</text>
  </g>

  <!-- Center Focal Card -->
  <g transform="translate(600, 337)">
    <!-- Container Box -->
    <rect x="-240" y="-120" width="480" height="240" fill="#121215" stroke="#3f3f46" stroke-width="1.5" />
    <rect x="-240" y="-120" width="480" height="4" fill="#5b21b6" />

    <!-- Center Icon: Code & Document Bracket -->
    <g transform="translate(0, -42)">
      <rect x="-30" y="-30" width="60" height="60" fill="#1c1917" stroke="#5b21b6" stroke-width="1.5" />
      <!-- Brackets < / > -->
      <path d="M -12 -8 L -18 0 L -12 8" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="square" />
      <path d="M 12 -8 L 18 0 L 12 8" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="square" />
      <line x1="-3" y1="10" x2="3" y2="-10" stroke="#71717a" stroke-width="2" />
    </g>

    <!-- Main Title -->
    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="1">
      ARTIKEL &amp; CATATAN TEKNIS
    </text>

    <!-- Subtitle -->
    <text x="0" y="60" text-anchor="middle" fill="#a1a1aa" font-family="monospace, monospace" font-size="12" letter-spacing="2">
      REKAYASA WEB &bull; DEVOPS &bull; DESAIN VISUAL
    </text>

    <!-- Bottom Pill -->
    <g transform="translate(0, 88)">
      <rect x="-65" y="-12" width="130" height="24" fill="#5b21b6" />
      <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="monospace, monospace" font-size="10" font-weight="bold" letter-spacing="1.5">
        BLOG ARTICLE
      </text>
    </g>
  </g>

  <!-- Bottom Coordinates / Status -->
  <g transform="translate(48, 630)">
    <text x="0" y="0" fill="#52525b" font-family="monospace, monospace" font-size="11" letter-spacing="1">
      LATENCY: OPTIMAL // STATUS: VERIFIED CONTENT // DEFAULT COVER
    </text>
  </g>
  <g transform="translate(1152, 630)">
    <text x="0" y="0" text-anchor="end" fill="#52525b" font-family="monospace, monospace" font-size="11" letter-spacing="1">
      SECURE STATIC CDN
    </text>
  </g>
</svg>
